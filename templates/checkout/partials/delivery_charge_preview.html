{% load i18n %}
{% load storefront_tags %}
<div id="order-summary-wrapper" hx-swap-oob="true">
  <div class="d-flex justify-content-between small py-2 border-bottom text-muted">
    <span>{% trans "Delivery Charge" %}</span>
    <span id="checkout-delivery-charge-value" hx-swap-oob="true">{% money_label delivery_charge display_currency %}</span>
  </div>
  <div class="d-flex justify-content-between fw-semibold mt-3 pt-2 border-top">
    <span>{% trans "Total" %}</span>
    <span id="checkout-grand-total-value" hx-swap-oob="true" class="text-floward">{% money_label grand_total display_currency %}</span>
  </div>
</div>
