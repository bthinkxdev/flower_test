{% load i18n %}
{% for addr in addresses %}
<div class="d-flex justify-content-between align-items-center mb-2">
  <div class="form-check">
    <input class="form-check-input" type="radio" name="address_id" value="{{ addr.pk }}" id="addr-{{ addr.pk }}"
           hx-post="{% url 'checkout:update-session' %}"
           hx-trigger="change"
           hx-include="#checkout-form"
           {% if checkout_session.address_id == addr.pk %}checked{% endif %}>
    <label class="form-check-label small" for="addr-{{ addr.pk }}">{{ addr.label }} — {{ addr.line1 }}, {{ addr.city.name }}</label>
  </div>
  <div class="d-flex gap-2">
    <button class="btn btn-sm btn-link p-0 text-secondary small" type="button"
            hx-get="{% url 'checkout:address-form' address_id=addr.pk %}"
            hx-target="#add-address-container"
            hx-swap="innerHTML"
            data-bs-toggle="collapse"
            data-bs-target="#addAddressCollapse">
      {% trans "Edit" %}
    </button>
    <button class="btn btn-sm btn-link p-0 text-danger small" type="button"
            hx-post="{% url 'checkout:delete-address' address_id=addr.pk %}"
            hx-target="#address-list-container"
            hx-confirm="{% trans 'Are you sure you want to delete this address?' %}">
      {% trans "Delete" %}
    </button>
  </div>
</div>
{% empty %}
<p class="text-muted small mb-0">{% trans "Add an address in your account." %}</p>
{% endfor %}

<div id="add-address-container" hx-swap-oob="true">
  <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
  {% include "checkout/partials/address_form_fields.html" %}
  <button type="button" class="btn btn-sm btn-floward mt-2"
          hx-post="{% url 'checkout:add-address' %}"
          hx-target="#address-list-container"
          hx-include="#add-address-container input, #add-address-container select"
          hx-on::after-request="if(event.detail.successful){ var c = bootstrap.Collapse.getOrCreateInstance(document.getElementById('addAddressCollapse')); c.hide(); }">
    {% trans "Save Address" %}
  </button>
</div>
