{% load i18n %}
{% include "checkout/partials/address_list_items.html" %}

<div id="add-address-container" hx-swap-oob="true">
  <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
  {% include "checkout/partials/address_form_fields.html" %}
  <button type="button" class="btn btn-sm btn-floward mt-3"
          hx-post="{% url 'checkout:add-address' %}"
          hx-target="#address-list-container"
          hx-include="#add-address-container input, #add-address-container select"
          hx-on::after-request="if(event.detail.successful){ bootstrap.Collapse.getOrCreateInstance(document.getElementById('addAddressCollapse')).hide(); }">
    {% trans "Save Address" %}
  </button>
</div>

<div id="order-summary-wrapper" hx-swap-oob="true">
  {% include "checkout/partials/order_summary_lines.html" with show_desktop_cta=True %}
</div>

<div id="delivery-slots-wrapper" hx-swap-oob="true">
  {% include "checkout/partials/delivery_slots_field.html" %}
</div>
