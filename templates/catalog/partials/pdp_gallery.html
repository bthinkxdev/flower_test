{% load i18n %}
<div class="pdp-gallery">
  <div class="pdp-gallery__stage main-image-wrap ratio ratio-1x1 zoom-container">
    {% with primary=product.images.first %}
    {% if primary %}
    <img id="main-pdp-image" src="{{ primary.image.url }}" alt="{{ primary.alt_text|default:product.name }}" class="w-100 h-100 object-fit-cover zoom-image" width="800" height="800" fetchpriority="high">
    {% endif %}
    {% endwith %}
  </div>
  <div class="pdp-gallery__thumbs thumbs">
    {% for image in product.images.all %}
    <button type="button" class="thumb-btn" data-full="{{ image.image.url }}" aria-label="{% trans 'View image' %} {{ forloop.counter }}">
      <img src="{{ image.image.url }}" alt="" width="64" height="64" class="object-fit-cover" loading="lazy">
    </button>
    {% endfor %}
  </div>
</div>
