{% load i18n %}
<div class="delivery-widget">
  <h3 class="delivery-widget__title">{% trans "Delivery Estimate" %}</h3>
  <select id="delivery-city" class="form-select form-select-sm mb-2" data-estimate-url="{% url 'catalog:delivery-estimate' product_id=product.pk %}">
    {% for city in cities %}
    <option value="{{ city.slug }}" {% if delivery_estimate.city == city.name %}selected{% endif %}>{{ city.name }}</option>
    {% endfor %}
  </select>
  <p id="delivery-estimate-text"
     class="delivery-widget__text mb-0"
     data-label-delivery="{% trans 'Delivery:' %}"
     data-label-to="{% trans 'to' %}"
     data-label-select-city="{% trans 'Select a city' %}">
    {% if delivery_estimate %}
    {% blocktrans with label=delivery_estimate.label city=delivery_estimate.city %}Delivery: {{ label }} to {{ city }}{% endblocktrans %}
    {% else %}{% trans "Select a city" %}{% endif %}
  </p>
</div>
