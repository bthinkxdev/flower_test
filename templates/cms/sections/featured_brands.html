{% load i18n %}
<section class="container mb-4 brand-rail-section">
  {% include "cms/sections/_section_title.html" with section_context=section_context fallback_key="Brands You'll Love" %}

  <div class="brand-rail" aria-label="{% trans 'Featured brands' %}">
    <button type="button"
            class="brand-rail-arrow brand-rail-arrow--prev"
            data-brand-scroll="prev"
            aria-label="{% trans 'Scroll brands left' %}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <ul class="brand-rail-track" role="list" data-brand-track>
      {% for brand in section_context.brands %}
      <li class="brand-card" role="listitem">
        <a href="{% url 'catalog:plp' %}?brand={{ brand.pk }}" class="brand-card-link" aria-label="{{ brand.name }}">
          <span class="brand-card-logo">
            {% if brand.logo %}
              <img src="{{ brand.logo.url }}"
                   alt="{{ brand.name }}"
                   loading="lazy"
                   decoding="async"
                   width="140" height="70">
            {% else %}
              <span class="brand-card-logo-fallback">{{ brand.name|slice:":2"|upper }}</span>
            {% endif %}
          </span>
          <span class="brand-card-name">{{ brand.name }}</span>
        </a>
      </li>
      {% endfor %}
    </ul>

    <button type="button"
            class="brand-rail-arrow brand-rail-arrow--next"
            data-brand-scroll="next"
            aria-label="{% trans 'Scroll brands right' %}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</section>
