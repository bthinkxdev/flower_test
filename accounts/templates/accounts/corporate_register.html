{% extends "base.html" %}
{% block title %}Corporate Registration{% endblock %}
{% block content %}
<h1>Corporate Account Registration</h1>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Submit for Approval</button>
</form>
{% if errors %}<div class="errors">{{ errors }}</div>{% endif %}
{% endblock %}
